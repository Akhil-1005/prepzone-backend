spring.application.name=prepzone-backend

# ── Server ────────────────────────────────────────────────────────────────────
# PORT is injected by Railway automatically; falls back to 8272 locally
server.port=${PORT:8272}
server.servlet.context-path=/prepzone

# ── Database (PostgreSQL) ─────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prepzone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwtSecret=${JWT_SECRET:yx3kXOBqgTgZG4tqZLH0BNGSep0tilxz}
app.jwtExpirationMs=900000
app.jwtRefreshExpirationMs=604800000
app.maxRefreshTokensPerUser=5

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowedOrigins=${CORS_ORIGINS:http://localhost:3000}

# ── Gemini Vision API ─────────────────────────────────────────────────────────
app.gemini.apiKey=${GEMINI_API_KEY:}

# ── Keep-alive scheduler ──────────────────────────────────────────────────────
app.selfUrl=${APP_SELF_URL:}

# ── Error handling ────────────────────────────────────────────────────────────
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
